async function showShipModal(oi) {
  const o = (window._mgmtOrders || [])[oi]; if (!o) return;
  toast("讀取寄倉餘量…", 1500);
  const pre = await api({ action: "getShipments", orderNo: o.orderNo }, true);
  const stkInfo = (pre && pre.ok) ? (pre.stockInfo || {}) : {};
  const remMap = {};
  if (pre && pre.ok) (pre.remain || []).forEach(x => { remMap[x.product + "|" + x.bottleType] = x.remain; });
  const rows = (o.items || []).map(it => {
    const q = Math.floor(+it.qty) || 0, sh = Math.floor(+it.shipped) || 0;
    const k = (it.product || "") + "|" + (it.bottleType || "");
    const rm = (remMap[k] != null) ? remMap[k] : Math.max(0, q - sh);
    const si = stkInfo[it.product || ""] || null;
    return { product: it.product || "", bottleType: it.bottleType || "", qty: q, shipped: sh, remain: rm,
             tracked: !!(si && si.tracked), stock: (si && si.tracked) ? si.stock : -1 };
  }).filter(r => r.remain > 0);
  if (!rows.length) { toast("本單已全部出清，無寄倉餘量"); return; }
  const seq = (o.shipBatches || 0) + 1;
  const body = rows.map(r => `
    <div style="display:flex;gap:6px;align-items:center;padding:6px;border:1px solid var(--border);border-radius:6px;margin-top:5px;font-size:12px;">
      <div style="flex:1;min-width:0;">
        <div style="font-weight:600;">${rcEsc(r.product)}${r.bottleType ? ` <span style="color:var(--ink3);font-weight:400;">${rcEsc(r.bottleType)}</span>` : ""}</div>
        <div style="font-size:11px;color:var(--ink3);">訂購 ${r.qty}・已出 ${r.shipped}・<b style="color:var(--gold-dk);">寄倉 ${r.remain}</b></div>
        <div style="font-size:11px;color:${r.tracked ? (r.stock < r.remain ? "#c0392b" : "var(--green)") : "var(--ink3)"};">${r.tracked ? `📦 本次會扣成品庫存（南坡萬v.2 現有 ${r.stock} 瓶）` : "（代工品項，不扣成品庫存）"}</div>
      </div>
      <div style="flex:0 0 88px;">
        <div style="font-size:10px;color:var(--ink3);">本次出貨</div>
        <input class="inp sp-q" type="number" min="0" max="${r.remain}" step="1" value="${r.remain}" oninput="spCalc()"
               data-p="${rcEsc(r.product)}" data-b="${rcEsc(r.bottleType)}" data-r="${r.remain}" data-stk="${r.stock}" style="margin:0;padding:4px 6px;font-size:13px;">
      </div>
      <div style="flex:0 0 76px;text-align:right;">
        <div style="font-size:10px;color:var(--ink3);">出貨後寄倉</div>
        <b class="sp-left" style="font-size:13px;color:var(--gold-dk);">0</b>
      </div>
    </div>`).join("");
  const modal = makeModal(`
    <div class="modal-title">🚚 登記第 ${seq} 次出貨</div>
    <div style="font-size:12px;color:var(--ink3);margin-bottom:8px;">${o.orderNo} · ${clientLabel(o.client)}｜表訂出貨日 ${o.deliveryDate || "—"}</div>
    <div class="fg" style="margin-bottom:6px;"><label>出貨日期</label><input class="inp" type="date" id="sp_date" value="${_shipToday()}" style="margin:0;"></div>
    <div style="font-size:12px;font-weight:600;color:var(--gold-dk);margin-top:6px;">出貨款式與數量<span style="font-weight:400;color:var(--ink3);">（預設＝目前寄倉量；只出一部分就把數字改小。自有酒款會同步扣成品庫存）</span></div>
    ${body}
    <div id="sp_warn" style="display:none;margin-top:6px;padding:6px 8px;border:1px solid #e74c3c;border-radius:6px;color:#c0392b;font-size:12px;font-weight:600;"></div>
    <div class="fg" style="margin-top:8px;"><label>備註（選填：寄倉／客戶自取／貨運單號…）</label><input class="inp" id="sp_note" style="margin:0;"></div>
    <div class="fe" style="margin-top:10px;gap:6px;">
      <button class="btn btn-ghost btn-sm" onclick="this.closest('.modal-bg').remove()">取消</button>
      <button class="btn btn-primary btn-sm" id="sp_sub">💾 儲存出貨紀錄</button>
    </div>`, { locked: true });
  spCalc();
  const b = modal.querySelector("#sp_sub");
  b.onclick = () => lockRun(b, async () => {
    const date = document.getElementById("sp_date").value;
    if (!date) { toast("請選出貨日期"); return; }
    const lines = []; let over = false;
    modal.querySelectorAll(".sp-q").forEach(el => {
      const q = Math.floor(+el.value) || 0, r = +el.dataset.r || 0;
      const stk = (el.dataset.stk == null) ? -1 : +el.dataset.stk;
      if (q > r || (stk >= 0 && q > stk)) over = true;
      if (q > 0) lines.push({ product: el.dataset.p, bottleType: el.dataset.b, qty: q });
    });
    if (over) { toast("出貨數量不可超過寄倉餘量或成品庫存"); return; }
    if (!lines.length) { toast("請至少填一款出貨數量"); return; }

  });
}
// 即時計算「出貨後寄倉」＋超量紅字警示
function spCalc() {
  const qs = document.querySelectorAll(".sp-q"), ls = document.querySelectorAll(".sp-left");
  const warn = document.getElementById("sp_warn"); const bad = [];
  qs.forEach((el, i) => {
    const r = +el.dataset.r || 0, q = Math.floor(+el.value) || 0;
    const stk = (el.dataset.stk == null) ? -1 : +el.dataset.stk;
    if (ls[i]) ls[i].textContent = String(Math.max(0, r - q));
    if (q > r) bad.push(el.dataset.p + " 最多 " + r + " 瓶（寄倉餘量）");
    else if (stk >= 0 && q > stk) bad.push(el.dataset.p + " 成品庫存只有 " + stk + " 瓶");
  });
  if (warn) {
    if (bad.length) { warn.style.display = "block"; warn.textContent = "⚠ 數量超過可出量：" + bad.join("、"); }
    else warn.style.display = "none";
  }
}

let _odTimer=null,_odLast='';
function orderDraftClear(){ try{ localStorage.removeItem('np_orderDraft'); }catch(e){} }
function _odSnap(){
  const il=document.getElementById('orderItemLines'); if(!il) return null;
  const modal=il.closest('.modal-bg'); if(!modal) return null;
  const header={};
  modal.querySelectorAll('input[id],select[id],textarea[id]').forEach(el=>{
    if(el.closest('#orderItemLines')) return;
    header[el.id]=(el.type==='checkbox')?{c:el.checked}:{v:el.value};
  });
  const lines=[...il.querySelectorAll('.order-line')].map(line=>{
    const li=line.id.replace('oline_','');
    const g=id=>{const e=document.getElementById('oi_'+li+'_'+id);return e?(e.type==='checkbox'?e.checked:e.value):'';};
    return { rec:g('rec'), qty:g('qty'), vol:g('vol'), bt:g('bt'), btc:g('btc'), smp:g('smp'), smpbt:g('smpbt'), smpqty:g('smpqty'), smpnote:g('smpnote') };
  });
  return { header, lines };
}
function orderDraftArm(){
  if(_odTimer) clearInterval(_odTimer);
  _odLast='';
  _odTimer=setInterval(function(){
    const s=_odSnap();
    if(!s){ clearInterval(_odTimer); _odTimer=null; return; } // modal 已關 → 自動停(草稿去留由關閉路徑決定)
    const j=JSON.stringify(s);
    if(j===_odLast) return;
    _odLast=j;
    // 有實質內容才留草稿(酒款有填或總金額>0)，剛開就關不留垃圾
    const meat=s.lines.some(l=>String(l.rec||'').trim())||Number((s.header.om_total||{}).v)>0;
    if(meat) lsSet('np_orderDraft',{ts:Date.now(),snap:s});
  },4000);
}
function orderDraftTryRestore(){
  const d=lsGet('np_orderDraft'); if(!d||!d.snap) return;
  if(Date.now()-(d.ts||0)>86400000){ orderDraftClear(); return; } // 超過24小時視為過期
  const w=new Date(d.ts), t=('0'+w.getHours()).slice(-2)+':'+('0'+w.getMinutes()).slice(-2);
  if(!confirm('💾 發現上次未儲存的建單草稿（'+t+' 留存）。\n按「確定」還原草稿；按「取消」開全新建單（草稿將刪除）。')){ orderDraftClear(); return; }
  const s=d.snap;
  // 1) 訂單類型：dispatch change 讓客戶欄位連動重建
  const typeEl=document.getElementById('om_type');
  if(typeEl&&s.header.om_type){ typeEl.value=s.header.om_type.v; typeEl.dispatchEvent(new Event('change')); }
  // 2) 客戶：只設值不觸發 change(orderModalClientChange 會清空酒款列/覆蓋配送)
  const cEl=document.getElementById('om_client');
  if(cEl&&s.header.om_client) cEl.value=s.header.om_client.v;
  // 3) 酒款列重建：清空→照草稿數量加列→依序回填(dispatch 事件觸發試飲展開/缺瓶檢查等副作用)
  const il=document.getElementById('orderItemLines');
  if(il){
    il.innerHTML=''; (s.lines||[]).forEach(()=>orderModalAddLine());
    [...il.querySelectorAll('.order-line')].forEach((line,ix)=>{
      const li=line.id.replace('oline_',''), L=s.lines[ix]||{};

async function consignShipItem(oi, ii) {
  const o = (window._mgmtOrders || [])[oi]; if (!o) return;
  const it = (o.items || [])[ii]; if (!it) return;
  const remain = (it.remainStock == null ? it.qty : it.remainStock) || 0;
  if (remain <= 0) { toast('此款已全部寄出'); return; }
  // v3.33 先查南坡萬成品庫存（主公 9/3 反映：被擋下卻沒說明）：對話框直接顯示庫存、預設可寄數量；庫存 0 直接告知不能寄
  toast('查詢南坡萬成品庫存…', 1500);
  const pre = await api({ action: 'getShipments', orderNo: o.orderNo }, true);
  const si = (pre && pre.ok && pre.stockInfo) ? pre.stockInfo[it.product] : null;
  const tracked = !!(si && si.tracked), stock = tracked ? (Math.floor(Number(si.stock)) || 0) : null;
  if (tracked && stock <= 0) {
    makeModal('<div class="modal-title" style="color:var(--red);">✕ 無法寄出：南坡萬成品庫存 0 瓶</div>'
      + '<div style="font-size:13px;line-height:1.7;">「' + _escf(it.product) + '」在南坡萬v.2 成品庫存帳上目前 <b>0 瓶</b>，寄出會扣這本帳，所以無法寄出。</div>'
      + '<div style="font-size:12px;color:var(--ink3);margin-top:10px;">請先到「成品庫存」分頁入庫該款（正式投產完工會自動入庫），再回來按寄出。叫貨流程在此暫停，不會有任何資料寫入。</div>'
      + '<div class="fe" style="margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="this.closest(\'.modal-bg\').remove()">知道了</button></div>');
    return;
  }
  const maxQ = tracked ? Math.min(remain, stock) : remain;
  const stockLine = tracked ? `南坡萬現有成品庫存 ${stock} 瓶` : '此款不追蹤成品庫存';
  const suggest = tracked ? `建議出貨量 ${maxQ} 瓶${stock < remain ? '（＝南坡萬現有最大庫存，不足以全寄 ' + remain + ' 瓶）' : '（可全寄）'}` : `建議出貨量 ${maxQ} 瓶（寄倉餘量）`;
  const qtyStr = prompt(`寄出「${it.product}」給 ${clientLabel(o.client)}\n寄倉餘量 ${remain} 瓶｜${stockLine}\n${suggest}\n本次寄出瓶數：`, String(maxQ));
  if (qtyStr == null) return;
  const qty = Math.floor(Number(qtyStr)) || 0;
  if (qty <= 0 || qty > remain) { toast('瓶數需介於 1～' + remain); return; }
  if (tracked && qty > stock) { toast('南坡萬成品庫存只有 ' + stock + ' 瓶，無法寄出 ' + qty + ' 瓶', 4500); return; }
  const date = _localDate();
  if (!confirm(`確認 ${date} 寄出 ${it.product} × ${qty} 瓶給 ${clientLabel(o.client)}？\n會扣南坡萬成品庫存、自動加入經銷商門市在庫，並把叫貨單標為已出貨。`)) return;
  const res = await api({ action: 'addShipment', orderNo: o.orderNo, date, lines: JSON.stringify([{ product: it.product, bottleType: it.bottleType || '', qty }]), note: '寄出給經銷商（單款一鍵）', operator: (curUser && curUser.username) || '' });
  if (!res.ok) {   // v3.33 失敗改彈窗（toast 5 秒容易漏看：9/3 主公按寄出被成品庫存擋下卻沒看到）
    makeModal('<div class="modal-title" style="color:var(--red);">✕ 寄出失敗，未寫入任何資料</div>'
      + '<div style="font-size:13px;line-height:1.7;">' + _escf(res.error || '') + '</div>'
      + '<div style="font-size:12px;color:var(--ink3);margin-top:10px;">若是「成品庫存不足」：寄出會扣南坡萬v.2 成品庫存，請先到「成品庫存」分頁入庫該款，或把本次寄出瓶數改小。</div>'
      + '<div class="fe" style="margin-top:12px;"><button class="btn btn-primary btn-sm" onclick="this.closest(\'.modal-bg\').remove()">知道了</button></div>');
    return;
  }
  const sd = res.stockDeducted || [];
  toast(`已寄出 ${it.product} × ${qty} 瓶${res.consignIn ? '・門市在庫已更新' : ''}${res.restockUpdated ? '・叫貨單→' + (res.allShipped ? '已出貨' : '部分出貨') : ''}${sd.length ? '｜扣成品庫存 ' + sd.map(d => d.product + '−' + d.qty).join('、') : ''}`, 5000);
  const m = document.querySelector('.modal-bg'); if (m) m.remove();

  if (typeof renderStockPage === 'function' && curTab === 'stock') renderStockPage();

      pm: (curUser && curUser.username) || '', creator: (curUser && curUser.username) || '', note: document.getElementById('ct_note').value
    });
    if (res.ok) {
      toast(`已完成：${it.product}（訂單${res.orderStatus}）` + (res.bottleDeduct ? `｜🍾 自動扣瓶 ${res.bottleDeduct.item}×${res.bottleDeduct.qty}（理論，剩 ${res.bottleDeduct.stock}）` : '')); modal.remove();

  });
}

// 確認出貨（admin+倉管）：接 shipOrder（後端整張擋負+冪等）
// ⚠️ v3.27 已退役（主公指示三鈕併一）：confirmShip／showConfirmShipModal 皆已從 UI 移除，
//    功能併入 showShipModal（出貨紀錄＋扣庫存）。函式保留備查，**請勿再接回按鈕**——
//    舊 shipOrder 是拿「訂單的客戶」扣庫存，對經銷商/樣品客戶永遠找不到帳（成品庫存只有南坡萬v.2 一本）。
async function confirmShip(oi) {
  const o = window._mgmtOrders[oi]; if (!o) return;
  if (!confirm(`確認出貨 ${o.orderNo}？將自動扣成品庫存，不可復原。`)) return;
  const res = await api({ action: 'shipOrder', orderNo: o.orderNo, operator: (curUser && curUser.username) || '' });
  if (res.ok) { toast(`已出貨 ${o.orderNo}（扣 ${res.shippedItems} 款）`); loadOrderMgmt(); }
  else toast(res.error || '出貨失敗');
}

// 確認/修正實際出貨日（admin+倉管）
function showConfirmShipModal(oi) {
  const o = window._mgmtOrders[oi]; if (!o) return;
  const modal = makeModal(`
    <div class="modal-title">🚚 確認實際出貨日</div>
    <div style="font-size:12px;color:var(--ink3);margin-bottom:10px;">${o.orderNo} · ${clientLabel(o.client)} ｜ 表訂出貨日 ${o.deliveryDate || '—'}</div>
    <div class="fg" style="margin-bottom:12px;"><label>實際出貨日</label><input class="inp" type="date" id="cs_actual" value="${o.actualDeliveryDate || o.deliveryDate || ''}" style="margin:0;"></div>
    <div class="fe"><button class="btn btn-ghost btn-sm" onclick="this.closest('.modal-bg').remove()">取消</button><button class="btn btn-primary btn-sm" id="cs_sub">確認</button></div>`);
  const b = modal.querySelector('#cs_sub');
  b.onclick = () => lockRun(b, async () => {
    const actualDate = document.getElementById('cs_actual').value;

    if (res.ok) { toast('實際出貨日已確認'); modal.remove(); loadOrderMgmt(); showShipDateAlerts(); }

// 登入後：到表訂出貨日未確認實際出貨日 → 提醒 admin+倉管（水位回升同理，確認後消失）
async function showShipDateAlerts(pre) {
  const old = document.getElementById('shipDateAlertBar'); if (old) old.remove();
  if (!curUser || !(curUser.role === 'admin' || curUser.role === '倉管')) return;
  const isAdmin = curUser.role === 'admin';
  const res = (pre && pre.ok) ? pre                                            // v3.14.4 開機吃 bootstrap 預抓
    : await api(isAdmin ? { action: 'getOrders' } : { action: 'getOrders', view: 'bartender' }, true);
  if (!res || !res.ok) return;
  const today = _localDate();
  const due = (res.orders || []).filter(o => o.status !== '已完成' && !o.shipDateConfirmed && o.deliveryDate && o.deliveryDate <= today);
  if (!due.length) return;
  const bar = document.createElement('div');
  bar.id = 'shipDateAlertBar';
  bar.style.cssText = 'display:flex;align-items:center;gap:8px;background:var(--gold-dk);color:#fff;font-size:12px;padding:6px 10px;line-height:1.5;cursor:pointer;';
  bar.innerHTML = `<span style="flex:1;">🚚 ${due.length} 張訂單已到表訂出貨日，請登記實際出貨（${due.slice(0, 3).map(o => o.orderNo).join('、')}${due.length > 3 ? '…' : ''}）</span><span style="padding:0 6px;font-weight:bold;white-space:nowrap;">前往訂單 ›</span>`;
  bar.onclick = () => switchTab('batch');
  const app = document.getElementById('app');
  app.insertBefore(bar, document.getElementById('mainContent'));
}

const STOCK_CLIENT = '南坡萬v.2';
let stockOverview = [];   // [{item,inQty,outQty,stock}]
let stockFilter = '';     // 異動歷史酒款篩選

// 本地日期 YYYY-MM-DD（避免 toISOString 的 UTC 位移）
function _localDate() {
  const d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

// ── 安全水位共用（成品庫存 / 玻璃瓶庫存 水位表共用）──
function _canSetSafety() { return curUser && (curUser.role === '倉管' || curUser.role === 'admin'); }
function safetyRow(x, category, client) {
  const low = x.safety > 0 && x.stock < x.safety;
  const safeCell = _canSetSafety()
    ? `<input type="number" min="0" step="1" value="${x.safety || 0}" data-item="${x.item}" style="width:56px;padding:4px;font-size:13px;text-align:right;border:1px solid var(--border);border-radius:4px;" onchange="saveSafety('${category}','${client}',this.dataset.item,this.value,this)">`
    : (x.safety || 0);
  return `<tr${low ? ' style="background:#fbeaea;"' : ''}>`
    + `<td>${x.item}${low ? ' <span style="color:var(--red);font-size:11px;">⚠低於水位</span>' : ''}<div style="font-size:11px;color:var(--ink3);">累計入 ${x.inQty} / 出 ${x.outQty}${x.ng ? ` / <span style="color:var(--red);">NG ${x.ng}</span>` : ''}</div>${x.reserved != null ? `<div style="font-size:11px;${(x.stock - x.reserved) < 0 ? 'color:var(--red);font-weight:700;' : 'color:var(--gold-dk);'}" title="${x.reservedDetail || ''}">訂單預佔 ${x.reserved}｜可用 ${x.stock - x.reserved}</div>` : ''}</td>`
    + `<td class="tr" style="font-weight:600;font-size:16px;${x.stock <= 0 ? 'color:var(--ink3);' : (low ? 'color:var(--red);' : '')}">${x.stock}</td>`
    + `<td class="tr">${safeCell}</td></tr>`;
}
async function saveSafety(category, client, item, value, el) {
  const level = parseInt(value, 10);
  if (!(level >= 0)) { toast('安全水位需為 0 或正整數'); return; }
  if (el) el.disabled = true;
  const res = await api({ action: 'setSafetyLevel', category, client, item, level, operator: (curUser && curUser.username) || '' });
  if (el) el.disabled = false;
  if (res.ok) {
    toast(`已設定「${item}」安全水位 ${level}`);
    if (category === '成品') loadStockOverview(); else loadBottleOverview();
  } else toast('設定失敗：' + (res.error || ''));
}
// 登入後：低於安全水位則頂端橫幅警告（水位回升後下次登入自動消失）
async function showStockAlerts(pre) {

  const bar = document.createElement('div');

  bar.innerHTML = `<span style="flex:1;">⚠ 庫存低於安全水位（${res.count} 項）：${lines}</span><span style="cursor:pointer;padding:0 6px;font-weight:bold;" onclick="this.parentElement.remove()">✕</span>`;

  app.insertBefore(bar, document.getElementById('mainContent'));

async function loadStockOverview() {
  const res = await api({ action: 'getStockOverview', client: STOCK_CLIENT });
  const area = document.getElementById('stockWaterArea');
  if (!area) return;
  if (!res.ok) { area.innerHTML = `<div style="color:var(--red);padding:12px;font-size:13px;">讀取失敗：${res.error || ''}</div>`; return; }
  stockOverview = res.list || [];
  if (!stockOverview.length) {
    area.innerHTML = '<div style="text-align:center;color:var(--ink3);padding:16px;font-size:13px;">尚無酒款</div>';
  } else {
    area.innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>酒款</th><th class="tr">目前庫存(瓶)</th><th class="tr">安全水位</th></tr></thead><tbody>'
      + stockOverview.map(x => safetyRow(x, '成品', STOCK_CLIENT, '瓶')).join('')
      + '</tbody></table></div>';
  }
  // 下拉：入/出庫 選單 + 歷史篩選（全款清單，含 0 庫存款）
  const opts = stockOverview.map(x => `<option value="${x.item}">${x.item}</option>`).join('');
  const si = document.getElementById('siItem'); if (si) si.innerHTML = opts;
  const so = document.getElementById('soItem'); if (so) so.innerHTML = opts;
  const fl = document.getElementById('slFilter');
  if (fl) { fl.innerHTML = '<option value="">全部酒款</option>' + opts; fl.value = stockFilter; }
}

async function loadStockLedger() {
  const area = document.getElementById('stockLedgerArea');
  if (!area) return;
  const params = { action: 'getStockLedger', client: STOCK_CLIENT };
  if (stockFilter) params.item = stockFilter;
  const res = await api(params);
  if (!res.ok) { area.innerHTML = `<div style="color:var(--red);padding:12px;font-size:13px;">讀取失敗：${res.error || ''}</div>`; return; }
  const rows = res.list || [];
  if (!rows.length) { area.innerHTML = '<div style="text-align:center;color:var(--ink3);padding:14px;font-size:13px;">尚無異動</div>'; return; }
  area.innerHTML = '<div class="tbl-wrap"><table><thead><tr><th>日期</th><th>類型</th><th class="tr">數量</th><th>Lot/訂單</th><th>操作人</th></tr></thead><tbody>'
    + rows.map(r => {
        const tag = r.type === '入庫'
          ? '<span style="color:var(--gold-dk);">入庫</span>'
          : '<span style="color:var(--red);">出庫</span>';

        return `<tr><td style="font-size:12px;">${r.date}</td><td>${tag}</td><td class="tr">${r.qty}</td><td style="font-size:12px;">${ref}</td><td style="font-size:12px;">${r.operator}</td></tr>`;
      }).join('')
    + '</tbody></table></div>';
}

async function doStockIn() {
  const item = document.getElementById('siItem').value;
  const qty = parseInt(document.getElementById('siQty').value, 10);
  if (!item) { toast('請選酒款'); return; }
  if (!(qty > 0)) { toast('數量需為正整數'); return; }
  const res = await api({
    action: 'stockIn', client: STOCK_CLIENT, item, qty,
    lot: document.getElementById('siLot').value || '',
    date: document.getElementById('siDate').value || '',
    operator: (curUser && curUser.username) || ''
  });
  if (res.ok) {
    toast(`已入庫，${item} 現有 ${res.stock} 瓶`);
    document.getElementById('siQty').value = ''; document.getElementById('siLot').value = '';
    loadStockOverview(); loadStockLedger();
  } else toast('入庫失敗：' + (res.error || ''));
}

async function doStockOut() {
  const item = document.getElementById('soItem').value;
  const qty = parseInt(document.getElementById('soQty').value, 10);
  if (!item) { toast('請選酒款'); return; }
  if (!(qty > 0)) { toast('數量需為正整數'); return; }
  const res = await api({
    action: 'stockOut', client: STOCK_CLIENT, item, qty,
    date: document.getElementById('soDate').value || '',
    operator: (curUser && curUser.username) || ''
  });
  if (res.ok) {
    toast(`已出庫，${item} 剩 ${res.stock} 瓶`);
    document.getElementById('soQty').value = '';
    loadStockOverview(); loadStockLedger();
  } else toast(res.error || '出庫失敗'); // 出庫不足時後端回明確訊息（含目前庫存）
}

const RC_STATIONS_DEFAULT = ['調和','反光目檢','填充','3抽1目檢','鎖瓶','背光目檢','巴殺','貼標','防漏測試','裝箱'];
let rcState = null;

function rcEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function rcToday(){ const d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function rcNewState(){
  return { id:'', orderNo:'', client:'', product:'', sheet:'', bottleType:'', prodDate:rcToday(),
    pm:(curUser&&curUser.username)||'', lot:'', version:'V1', status:'進行中',
    totalVol:0, bottles:'', labelFrontOk:false, labelBackOk:false, processNote:'',

// 複合原料子料 → 結構化 subs（成本欄不進 run card）
function rcSubs(ing){
  if(!ing||!ing.isCompound) return [];
  return (ing.subMaterials||[]).map(s=>({ name:s.name, ratio:(s.ratio!=null?s.ratio:(s.coef!=null?s.coef:'')) }));
}

// v3.14.4 索引建法抽成函式，供 ensureRcIndex 與開機 bootstrap 共用（避免兩處邏輯走樣）
function _rcIdxApply(r) {
  if (!r || !r.ok) return;
  const m = new Map(); // key → {done:任一卡狀態=完成}
  (r.index || []).forEach(x => {
    const k = x.orderNo + '||' + x.product;
    const cur = m.get(k) || { done: false };
    if (x.status === '完成' || x.finalDone) cur.done = true; // v3.6 第11站完成也算已完成
    m.set(k, cur);
  });
  window._rcIdx = m; window._rcIdxAt = Date.now();
  window._rcIdxRows = r.index || []; // v3.8.4 原始列(含 id/client)：無訂單獨立卡區用
}
async function ensureRcIndex(force) {
  if (!force && window._rcIdx && Date.now() - (window._rcIdxAt || 0) < 60000) return;
  try { _rcIdxApply(await api({ action: 'getRunCardIndex' }, true)); } catch (e) { }
}

// 由訂單酒款帶入（配方走 getRecipeForProduction：成本已剝除、整單放量）
async function rcFillFromOrderItem(st, o, it){
  st.orderNo=o.orderNo; st.client=o.client; st.product=it.product||''; st.sheet=it.sheet||'';
  st.bottleType=it.bottleType||''; st.pm=o.pm||st.pm; st.lot=o.lot||''; st.bottles=it.qty||'';
  if(!it.sheet){ toast('此酒款未綁酒譜，原料請手動填'); return st; }
  const res=await api({ action:'getRecipeForProduction', client:(it.srcClient||o.client), sheet:it.sheet, volume:it.volume||'', qty:it.qty||0 });
  if(res.ok){
    st.totalVol=Math.round(res.orderTotalMl||0);
    st.processNote=res.processNote||'';
    st.liquids=(res.ingredients||[]).map(g=>{
      const p=st.totalVol>0?Math.round((+g.orderVol||0)/st.totalVol*1000)/10:0;
      return { name:g.name, pct:p, abv:+g.abv||0, vol:Math.round(+g.orderVol||0),
        fed:false, ordered:false, note:'', subs:rcSubs(g), hasLoss:!!g.hasLoss, method:String(g.method||''),
        locked:true, origPct:p, origName:String(g.name||'').trim() }; });
  } else toast('酒譜帶入失敗：'+(res.error||'')+'，請手動填原料');
  return st;
}

  rcOpenEditor(st);
}

let _rcDraftTimer=null,_rcLastSnap='';
function rcAutoSaveArm(){
  rcAutoSaveStop();

  _rcSrvSnap=_rcLastSnap; _rcSrvAt=Date.now(); // v3.8 開卡即設回存基準(開卡未改不觸發回存)
  _rcDraftTimer=setInterval(function(){
    if(!rcState){ rcAutoSaveStop(); return; }
    const snap=JSON.stringify(rcState);
    if(snap!==_rcLastSnap){
      _rcLastSnap=snap;
      lsSet('np_rcDraft',{ts:Date.now(),state:rcState});
      const el=document.getElementById('rcDraftInfo');
      if(el){ const d=new Date(); el.textContent='💾 已自動暫存 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2); }

    if(rcState.id&&snap!==_rcSrvSnap&&Date.now()-_rcSrvAt>120000) rcSrvAutoSave(snap);
  },4000);
}
function rcAutoSaveStop(){ if(_rcDraftTimer){ clearInterval(_rcDraftTimer); _rcDraftTimer=null; } }

// 占比 ↔ 放量互算（總體積為基準；直接改 input 值、不整段重繪避免失焦）
function rcTv(v){
  if(!rcState) return;
  rcState.totalVol=+v||0;
  rcState.liquids.forEach((g,i)=>{
    g.vol=Math.round(rcState.totalVol*(+g.pct||0)/100);
    const el=document.querySelector('#rcL_'+i+' .rc-vol'); if(el) el.value=g.vol;
  });
}
function rcLPct(i,v){
  const g=rcState.liquids[i]; if(!g) return;
  g.pct=+v||0; g.vol=Math.round((rcState.totalVol||0)*g.pct/100);
  const el=document.querySelector('#rcL_'+i+' .rc-vol'); if(el) el.value=g.vol;
  rcPctSum(); rcAbvUpd(); rcDevUpd(i);
}
function rcLVol(i,v){
  const g=rcState.liquids[i]; if(!g) return;
  g.vol=+v||0;
  if(rcState.totalVol>0){
    g.pct=Math.round(g.vol/rcState.totalVol*1000)/10;
    const el=document.querySelector('#rcL_'+i+' .rc-pct'); if(el) el.value=g.pct;
  }
  rcPctSum(); rcAbvUpd(); rcDevUpd(i);
}
function rcPctSum(){
  const el=document.getElementById('rcPctSum'); if(!el||!rcState) return;
  const s=rcState.liquids.reduce((a,g)=>a+(+g.pct||0),0);
  const r=Math.round(s*10)/10;
  el.textContent=r+'%';
  el.style.color=(rcState.liquids.length&&Math.abs(r-100)>=0.05)?'#c0392b':''; // v3.8.3 收緊：非 100.0% 即紅(原 0.5 容差漏掉 99.9%)
}
function rcAbvUpd(){
  const el=document.getElementById('rcAbv'); if(!el||!rcState) return;
  const a=rcState.liquids.reduce((s,g)=>s+(+g.abv||0)*(+g.pct||0)/100,0);
  el.textContent=(Math.round(a*10)/10)+'%';
}
// 執行人員清單：取登入頁帳號按鈕格（與「使用者資料」同步維護），失敗用固定清單
function rcOperators(){
  let names=[];
  try{ names=[].slice.call(document.querySelectorAll('#loginUserGrid .login-user-btn')).filter(function(b){return b.style.display!=='none';}).map(function(b){return b.textContent.trim();}).filter(Boolean); }catch(e){} // v3.5 P2-12：排除隱藏帳號(小捲/上海Jason)
  if(!names.length) names=['Lulu','Kevin','阿軒','Molly','小李','Vic'];
  return names;
}
function rcNowMin(){ const d=new Date(); const p=n=>('0'+n).slice(-2); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function rcDurTxt(s){
  if(!s||!s.inAt||!s.outAt) return '';
  const a=new Date(String(s.inAt).replace(' ','T')), b=new Date(String(s.outAt).replace(' ','T'));
  if(isNaN(a)||isNaN(b)||b<a) return '';
  return '停留 '+(Math.round((b-a)/360000)/10)+' 小時';
}
function rcStamp(i,k){
  // v3.8 卡點1：按鈕本身即狀態(綠底+時間)、已有時間再按跳確認防誤蓋(猛按不再默默覆蓋原時間)
  const s=rcState&&rcState.stations[i]; if(!s) return;
  const isIn=k==='inAt';
  if(s[k]&&!confirm((isIn?'入站':'出站')+'時間已記錄為 '+s[k]+'\n確定要覆蓋成現在時間嗎？')) return;
  s[k]=rcNowMin();
  const btn=document.getElementById((isIn?'rcInBtn_':'rcOutBtn_')+i);
  if(btn){ btn.textContent=(isIn?'✓ 入站 ':'✓ 出站 ')+s[k]; btn.classList.add('rc-stamped'); }
  const d=document.getElementById('rcDur_'+i); if(d) d.textContent=rcDurTxt(s);
  toast((isIn?'已記錄入站時間 ':'已記錄出站時間 ')+s[k]);
}
function rcDeviated(g){ return g.origPct!=null && Math.abs((+g.pct||0)-(+g.origPct||0))>=0.05; }
// v3.8.2 品名偏差（主公裁示：品名全面開放編輯，但改了一律留痕）
function rcNameDeviated(g){ return g.origName!=null && String(g.name||'').trim()!==String(g.origName||'').trim(); }
function rcAnyDev(g){ return rcDeviated(g)||rcNameDeviated(g); }
function rcDevUpd(i){
  const g=rcState&&rcState.liquids[i]; if(!g) return;
  const row=document.getElementById('rcL_'+i); if(!row) return;
  const devP=rcDeviated(g), devN=rcNameDeviated(g), dev=devP||devN;
  const pctEl=row.querySelector('.rc-pct'); if(pctEl) pctEl.classList.toggle('rc-dev',devP);
  const nameEl=row.querySelector('.rc-name'); if(nameEl) nameEl.classList.toggle('rc-dev',devN);
  const tag=row.querySelector('.rc-devtag');
  if(tag){
    tag.style.display=dev?'':'none';
    tag.textContent=[devN?('原名 '+g.origName):'',devP?('原 '+g.origPct+'%'):''].filter(Boolean).join('｜');
  }
  const note=row.querySelector('.rc-note');
  if(note){
    note.classList.toggle('rc-note-need',dev&&!String(g.note||'').trim());
    note.placeholder=dev?('⚠ '+[devN?'品名':'',devP?'占比':''].filter(Boolean).join('與')+'已改（'+[devN?('原名 '+g.origName):'',devP?('原 '+g.origPct+'%'):''].filter(Boolean).join('、')+'），請填修改原因'):'備註（製法）';
  }
}
function rcResetPct(){
  if(!rcState) return;
  let n=0;
  rcState.liquids.forEach(g=>{
    if(g.origPct==null&&g.origName==null) return;
    if(rcAnyDev(g)) n++;
    if(g.origPct!=null){ g.pct=+g.origPct; g.vol=Math.round((rcState.totalVol||0)*g.pct/100); }
    if(g.origName!=null) g.name=g.origName;
  });
  rcRenderBody();
  toast(n?('已回復 '+n+' 項原料至原配方（占比／品名）'):'占比與品名已與原配方相同，未變動');
}

// v3.8 saveRunCard 參數統一組裝（手動儲存與自動回存共用）
function _rcPayload(st){
  const data={ totalVol:st.totalVol, bottles:st.bottles, labelFrontOk:!!st.labelFrontOk, labelBackOk:!!st.labelBackOk,
    processNote:st.processNote, liquids:st.liquids, solids:st.solids, stations:st.stations,
    printLog:st.printLog||[] }; // v3.11 紙本列印歷史隨卡片 JSON 入庫
  if(st.autoStockedIn) data.autoStockedIn=st.autoStockedIn; // v3.11.2 冪等旗標跟卡走（防重複自動入庫）
  return { action:'saveRunCard', id:st.id||'', orderNo:st.orderNo||'',
    client:String(st.client).trim(), product:String(st.product).trim(), sheet:st.sheet||'',
    bottleType:st.bottleType||'', prodDate:st.prodDate||'', pm:st.pm||'', lot:st.lot||'',
    version:st.version||'', status:st.status||'進行中',
    user:(curUser&&curUser.username)||'', data:JSON.stringify(data) };
}
let _rcSaving=false, _rcSrvAt=0, _rcSrvSnap='';
async function rcSave(){
  const st=rcState; if(!st) return;
  if(_rcSaving) return; // v3.8 跨鈕全域鎖：頂/底兩顆儲存鈕不能各發一次(防重複建卡)
  if(!String(st.client||'').trim()||!String(st.product||'').trim()){ toast('客戶名稱與酒款名稱必填'); return; }
  const bad=st.liquids.map((g,i)=>({g,i})).filter(x=>rcAnyDev(x.g)&&!String(x.g.note||'').trim());
  if(bad.length){
    toast('⚠ '+bad.length+' 項原料的占比／品名與原配方不同，請在該原料「備註」寫下修改原因');
    st.liquids.forEach(function(_,i){ rcDevUpd(i); });
    const row=document.getElementById('rcL_'+bad[0].i);
    if(row) row.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  // v3.8.3 占比合計≠100% 確認（主公指示：製酒誤觸防呆）——手動儲存為守門點，自動回存不打擾
  if(st.liquids.length){
    const sumPct=Math.round(st.liquids.reduce((a,g)=>a+(+g.pct||0),0)*10)/10;
    if(Math.abs(sumPct-100)>=0.05 && !confirm('⚠ 目前液體原料占比合計為 '+sumPct+'%，並非 100%。\n若是誤觸請按「取消」回去修正；確認是否繼續儲存？')) return;
  }
  // v3.8.2 基準補齊：儲存時把缺基準的原料(酒譜帶入失敗的手動卡/舊卡)以當前值蓋上 origPct/origName
  // ——首次存檔狀態=基準；之後再改占比或品名一律觸發紅字+必填原因(全卡統一防呆，不再有無防呆卡)
  st.liquids.forEach(g=>{
    if(g.origPct==null&&((+g.pct||0)>0||(+g.vol||0)>0)) g.origPct=Math.round((+g.pct||0)*10)/10;
    if(g.origName==null&&String(g.name||'').trim()) g.origName=String(g.name).trim();
  });
  _rcSaving=true;
  try{
    const res=await api(_rcPayload(st));
    if(res.ok){
      if(!st.id) st.id=res.id;
      const t=document.getElementById('rcTitle'); if(t) t.textContent='📋 編輯 Run Card '+st.id;
      rcDraftClear(); _rcLastSnap=JSON.stringify(rcState);
      _rcSrvSnap=_rcLastSnap; _rcSrvAt=Date.now(); // v3.8 自動回存基準點
      const di=document.getElementById('rcDraftInfo'); if(di) di.textContent='';
      toast('已儲存 '+st.id+(res.autoStockIn?('｜📦 成品自動入庫 '+res.autoStockIn.item+'×'+res.autoStockIn.qty):''));
      ensureRcIndex(true).then(() => { if (window._mgmtOrders) renderMonthOrders(window._mgmtOrders); }); // v2.9.3 新卡即時亮鈕
    } else toast('儲存失敗：'+(res.error||''));
  } finally { _rcSaving=false; }
}
// v3.8 卡點3：已存過的卡(有 id)每 2 分鐘靜默回存後端；新卡不自動建卡(維持草稿制防半成品卡)
async function rcSrvAutoSave(snap){
  const st=rcState; if(!st||!st.id||_rcSaving) return;
  if(!String(st.client||'').trim()||!String(st.product||'').trim()) return;
  if(st.liquids.some(g=>rcAnyDev(g)&&!String(g.note||'').trim())) return; // 驗證不過→留給手動儲存提示(自動回存不蓋基準)
  _rcSaving=true;
  try{
    const res=await api(_rcPayload(st), true);
    if(res&&res.ok){
      _rcSrvSnap=snap; _rcSrvAt=Date.now(); rcDraftClear(); _rcLastSnap=snap;
      const el=document.getElementById('rcDraftInfo');
      if(el){ const d=new Date(); el.textContent='☁ 已自動儲存 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
    }
  }catch(e){} finally { _rcSaving=false; }
}

  const m = makeModal(`
    <div class="modal-title">✅ 登記帳款已結清：${_escf(d.cfg.label)} ${_periodLabel(s.period)}</div>
    <div class="recipe-meta" style="grid-template-columns:repeat(2,1fr);"><div class="rm"><div class="lb">售出</div><div class="vl">${d.calc.totalSold} 瓶</div></div><div class="rm"><div class="lb">請款金額（以帳本最新數字為準）</div><div class="vl acc">${_ntf(d.calc.totalAmount)}</div></div></div>
    <div class="form-row"><div class="fg"><label>款項入帳日</label><input class="inp" id="cs_date" type="date" value="${_localDate()}" max="${_localDate()}" style="margin:0;"></div><div class="fg"><label>備註（選填）</label><input class="inp" id="cs_note" placeholder="例：匯款末五碼" style="margin:0;"></div></div>
    <div style="font-size:12px;color:var(--ink2);line-height:1.7;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;">結清後系統會：① 對帳單鎖定為「已結清」，該月流水帳不可再改；② 自動在訂單列表建立一張「<b>經銷商寄售月結認列單</b>」（客戶＝${_escf(d.cfg.label)}、明細＝當期實售酒款數量、金額＝${_ntf(d.calc.totalAmount)}、尾款實收日＝入帳日），當月金流總覽與收款率自動更新。</div>
    <div class="fe" style="margin-top:10px;"><button class="btn btn-ghost btn-sm" onclick="this.closest('.modal-bg').remove()">取消</button><button class="btn btn-sm" style="background:var(--green);color:#fff;font-weight:700;" id="cs_sub">✅ 確認已收到款，結清</button></div>`, { locked: true });
  const b = m.querySelector('#cs_sub');
  b.onclick = () => lockRun(b, async () => {
    const res = await api({ action: 'consignStatementSettle', id: s.id, paidDate: m.querySelector('#cs_date').value, note: m.querySelector('#cs_note').value, pm: (curUser && curUser.username) || 'Molly' });
    if (res.ok) { toast(`已結清 ${_ntf(res.amount)}${res.orderNo ? '，認列單 ' + res.orderNo : ''}`, 3500); m.remove(); loadConsignOverview(); if (typeof loadOrderMgmt === 'function' && document.getElementById('orderMgmtList')) loadOrderMgmt(); }
    else toast('結清失敗：' + (res.error || ''), 4000);
  });
}
// ✍ 代登異動：經銷商沒登、或電話告知時，南坡萬代為登記（售出／退貨／損耗／盤點修正）
function showConsignEntryModal(i) {
  const d = _consignOv.dealers[i];
  const stock = (d.stockItems || []).slice().sort((a, b) => a.product.localeCompare(b.product));
  if (!stock.length) { toast('該經銷商尚無門市在庫（先出貨）'); return; }
  const m = makeModal(`
    <div class="modal-title">✍ 代登異動：${_escf(d.cfg.label)}</div>
    <div class="form-row">
      <div class="fg"><label>異動類型</label><select class="inp" id="ce_type" style="margin:0;" onchange="consignEntryTypeChange()"><option value="售出">售出（代經銷商登記，單價依折扣凍結）</option><option value="盤點修正">盤點修正（填實際盤點數）</option><option value="退貨">退貨（退回南坡萬）</option><option value="損耗">損耗</option></select></div>
      <div class="fg" style="flex:0 0 150px;"><label>日期</label><input class="inp" id="ce_date" type="date" value="${_localDate()}" max="${_localDate()}" style="margin:0;"></div>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>酒款</th><th class="tr">在庫</th><th class="tr">單價</th><th class="tr" id="ce_colhd">售出瓶數</th></tr></thead><tbody>
      ${stock.map((s, j) => `<tr><td>${_escf(s.product)}<div style="font-size:11px;color:var(--ink3);">${_escf(s.volume)}</div></td><td class="tr">${s.qty}</td><td class="tr">${s.unitPrice !== '' ? s.unitPrice : '<span style="color:var(--red);">缺牌價</span>'}</td><td class="tr"><input type="number" inputmode="numeric" min="0" id="ce_q_${j}" value="0" style="width:64px;padding:5px;text-align:right;border:1px solid var(--border);border-radius:6px;font-size:13px;"></td></tr>`).join('')}
    </tbody></table></div>
    <input class="inp" id="ce_note" placeholder="備註（退貨／損耗／盤點修正必填原因）" style="margin:10px 0 4px;">
    <div class="fe" style="margin-top:8px;"><button class="btn btn-ghost btn-sm" onclick="this.closest('.modal-bg').remove()">取消</button><button class="btn btn-primary btn-sm" id="ce_sub">送出</button></div>`, { locked: true });
  m._stock = stock;
  window._consignEntryModal = m;
  const b = m.querySelector('#ce_sub');
  b.onclick = () => lockRun(b, async () => {
    const type = m.querySelector('#ce_type').value, date = m.querySelector('#ce_date').value, note = m.querySelector('#ce_note').value.trim();
    const lines = [];
    stock.forEach((s, j) => {
      const v = parseInt(m.querySelector('#ce_q_' + j).value, 10);
      if (type === '盤點修正') { if (!isNaN(v) && v !== s.qty) lines.push({ product: s.product, volume: s.volume, qty: v }); }
      else if (v > 0) lines.push({ product: s.product, volume: s.volume, qty: v });
    });
    if (!lines.length) { toast('沒有要登記的數量'); return; }
    let res;
    if (type === '售出') res = await api({ action: 'consignSale', dealer: d.cfg.key, date, note, lines: JSON.stringify(lines) });
    else { if (!note) { toast('請填原因'); return; } res = await api({ action: 'consignAdjust', dealer: d.cfg.key, type, date, note, lines: JSON.stringify(lines) }); }
    if (res.ok) { toast('已登記 ' + type + (res.amount != null ? '・' + _ntf(res.amount) : '')); m.remove(); loadConsignOverview(); } else toast(res.error || '登記失敗', 4500);
  });
}
function consignEntryTypeChange() {
  const m = window._consignEntryModal; if (!m) return;
  const t = m.querySelector('#ce_type').value;
  m.querySelector('#ce_colhd').textContent = t === '盤點修正' ? '實際盤點數' : (t + '瓶數');
  (m._stock || []).forEach((s, j) => { const el = m.querySelector('#ce_q_' + j); if (el) el.value = t === '盤點修正' ? s.qty : 0; });
}
// 🏷 牌價表（唯讀；改價請至主表「牌價表」分頁——每季報價單更新時 Molly 自己改，不用動程式）
async function showConsignPrices() {
  const res = await api({ action: 'consignPrices' });
  if (!res.ok) { toast('讀取失敗：' + (res.error || '')); return; }
  const byProd = {};
  (res.prices || []).forEach(p => { (byProd[p.product] = byProd[p.product] || { pubName: p.pubName, v: {} }).v[p.volume] = p.price; });
  const vols = ['100ml', '500ml', '700ml'];
  const dealers = (window._consignDealers || []).filter(d => d.enabled);
  makeModal(`
    <div class="modal-title">🏷 牌價表（建議零售價，含稅）</div>
    <div style="font-size:12px;color:var(--ink3);margin-bottom:8px;">來源：主表「牌價表」分頁（Molly 通路報價單 202609）。經銷商成交單價＝牌價 × 折扣，四捨五入到整數，於登記售出當下凍結。改價請直接編輯該分頁。</div>
    <div class="tbl-wrap" style="overflow-x:auto;"><table style="min-width:520px;"><thead><tr><th>酒款（系統名）</th><th>對外名稱</th>${vols.map(v => `<th class="tr">${v}</th>`).join('')}${dealers.map(d => `<th class="tr" style="color:var(--gold-dk);">${_escf(d.label)} ${_pctf(d.discount)}<div style="font-size:10px;font-weight:400;">100/500/700</div></th>`).join('')}</tr></thead><tbody>
      ${Object.keys(byProd).sort().map(pn => `<tr><td>${_escf(pn)}</td><td style="color:var(--ink3);">${_escf(byProd[pn].pubName)}</td>${vols.map(v => `<td class="tr">${byProd[pn].v[v] != null ? byProd[pn].v[v] : '—'}</td>`).join('')}${dealers.map(d => `<td class="tr" style="font-size:12px;">${vols.map(v => byProd[pn].v[v] != null ? Math.round(byProd[pn].v[v] * d.discount) : '—').join(' / ')}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="fe" style="margin-top:10px;"><button class="btn btn-primary btn-sm" onclick="this.closest('.modal-bg').remove()">關閉</button></div>`);
}

</script>
</body>
</html>
