<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱文南坡萬 — 訂單管理系統（前台 Demo v1）</title>
<!--
=====================================================================
  凱文南坡萬實業社 — 訂單管理系統 前台 Demo v1
  製作：軍師（Cowork）  日期：2026-06-13
  用途：交付給酒廠助理 Molly，作為後台 web app 的前台基礎
---------------------------------------------------------------------
  【給 Molly 的後端串接說明】
  本檔為「純前台 + localStorage 暫存」的可運作 Demo，方便主公週末試用。
  接手改為 web app 時，只需替換 4 個資料存取函式（已集中標記為
  「BACKEND HOOK」），其餘 UI / 預警 / 試算邏輯都可沿用：
    1. loadOrders()        讀取所有訂單   → 改成 GET  /api/orders
    2. saveOrder(order)    新增/更新一筆 → 改成 POST/PUT /api/orders
    3. deleteOrder(id)     刪除一筆       → 改成 DELETE /api/orders/:id
  訂單資料結構（單筆 order 物件）見下方 SCHEMA 註解。
=====================================================================
-->
<style>
  :root{
    --cream:#FBF8F1; --cream-2:#F4EFE3; --paper:#FFFFFF;
    --ink:#2A2724; --ink-soft:#6F6A61; --line:#E5DDCB;
    --mint:#6FA287; --mint-soft:#E4EFE8; --mint-dark:#4F8068;
    --gold:#C2A04C; --gold-dark:#A8862F; --gold-soft:#F6EFD8;
    --warn:#C0563F; --warn-soft:#FBE9E3; --ok:#4F8068;
    --shadow:0 1px 3px rgba(42,39,36,.08),0 6px 20px rgba(42,39,36,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       background:var(--cream);color:var(--ink);font-size:15px;line-height:1.6}
  header.app{background:linear-gradient(120deg,#2F3A33,#3D4A40);color:#fff;
       padding:18px 28px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  header.app .logo{width:38px;height:38px;border-radius:9px;background:var(--gold);
       display:flex;align-items:center;justify-content:center;font-weight:800;color:#2F3A33;font-size:18px}
  header.app h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.5px}
  header.app .sub{font-size:12.5px;color:#C9D3CB;margin-top:2px}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}

  /* 儀表板摘要卡 */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;
       padding:16px 18px;box-shadow:var(--shadow)}
  .card .k{font-size:12.5px;color:var(--ink-soft);font-weight:600}
  .card .v{font-size:27px;font-weight:800;margin-top:4px}
  .card.warn .v{color:var(--warn)} .card.gold .v{color:var(--gold-dark)} .card.mint .v{color:var(--mint-dark)}
  .card .note{font-size:11.5px;color:var(--ink-soft);margin-top:2px}

  /* 預警橫幅 */
  #alertBanner{display:none;background:var(--warn-soft);border:1px solid #E9B6A8;
       color:#8F3A28;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:13.5px}
  #alertBanner b{color:var(--warn)}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;
       box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
  .panel>.head{padding:14px 20px;border-bottom:1px solid var(--line);
       display:flex;align-items:center;justify-content:space-between;background:var(--cream-2)}
  .panel>.head h2{font-size:16px;margin:0;font-weight:700}
  .panel>.head .hint{font-size:12px;color:var(--ink-soft)}
  .panel>.body{padding:20px}

  /* 表單 */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.col2{grid-column:span 2} .field.col3{grid-column:span 3}
  label{font-size:12.5px;font-weight:600;color:var(--ink-soft)}
  label .req{color:var(--warn)}
  input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
       background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 3px var(--mint-soft)}
  input[readonly]{background:var(--gold-soft);font-weight:700;color:var(--gold-dark)}
  .sub-h{font-size:12px;font-weight:800;color:var(--mint-dark);text-transform:uppercase;
       letter-spacing:1px;margin:6px 0 2px;grid-column:span 3;
       border-bottom:1px dashed var(--line);padding-bottom:6px}
  .pair{display:flex;gap:8px} .pair>div{flex:1}

  /* 酒款明細列 */
  #itemRows{display:flex;flex-direction:column;gap:9px}
  .item-row{display:grid;grid-template-columns:2.2fr .9fr 1fr .7fr auto;gap:9px;align-items:center}
  .item-row .del{background:var(--warn-soft);color:var(--warn);border:1px solid #E9B6A8;
       border-radius:8px;width:34px;height:38px;cursor:pointer;font-size:16px;line-height:1}
  .btn{border:none;border-radius:9px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
  .btn.ghost{background:var(--mint-soft);color:var(--mint-dark)}
  .btn.gold{background:var(--gold);color:#2F3A33} .btn.gold:hover{background:var(--gold-dark);color:#fff}
  .btn.dark{background:#2F3A33;color:#fff}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;
       padding-top:16px;border-top:1px solid var(--line)}

  /* 列表 */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:12px;color:var(--ink-soft);background:var(--cream-2);font-weight:700;
       position:sticky;top:0}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr.warn-row{background:var(--warn-soft)} tr.over-row{background:#F7DCD4}
  .table-scroll{overflow-x:auto}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .b-mint{background:var(--mint-soft);color:var(--mint-dark)}
  .b-gold{background:var(--gold-soft);color:var(--gold-dark)}
  .b-warn{background:var(--warn-soft);color:var(--warn)}
  .b-gray{background:#ECE7DB;color:var(--ink-soft)}
  .b-ok{background:#DCEEE3;color:var(--ok)}
  .row-act{display:flex;gap:6px}
  .row-act button{border:1px solid var(--line);background:#fff;border-radius:7px;
       padding:4px 9px;cursor:pointer;font-size:12px}
  .row-act button:hover{border-color:var(--mint);color:var(--mint-dark)}
  .empty{text-align:center;color:var(--ink-soft);padding:40px;font-size:14px}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toolbar input,.toolbar select{width:auto}
  .demo-note{font-size:11.5px;color:var(--ink-soft);margin-top:10px;text-align:right}

  @media(max-width:860px){
    .cards{grid-template-columns:repeat(2,1fr)}
    .grid{grid-template-columns:1fr 1fr}
    .field.col2,.field.col3,.sub-h{grid-column:span 2}
    .item-row{grid-template-columns:1fr 1fr;}
  }
</style>
</head>
<body>
<header class="app">
  <div class="logo">凱</div>
  <div>
    <h1>凱文南坡萬 — 訂單管理系統</h1>
    <div class="sub">B2B 代工接單 · 排產 · 出貨追蹤　|　前台 Demo v1</div>
  </div>
</header>

<div class="wrap">

  <!-- 出貨預警橫幅 -->
  <div id="alertBanner"></div>

  <!-- 儀表板摘要 -->
  <div class="cards">
    <div class="card mint"><div class="k">訂單總數</div><div class="v" id="cTotal">0</div><div class="note">目前系統內訂單筆數</div></div>
    <div class="card warn"><div class="k">出貨預警（7 天內）</div><div class="v" id="cWarn">0</div><div class="note">含已逾期未出貨</div></div>
    <div class="card gold"><div class="k">待收訂金</div><div class="v" id="cDep">0</div><div class="note">訂金尚未填實際付款日</div></div>
    <div class="card gold"><div class="k">待收尾款</div><div class="v" id="cFinal">0</div><div class="note">尾款尚未填實際付款日</div></div>
  </div>

  <!-- 新增 / 編輯 訂單 -->
  <div class="panel">
    <div class="head">
      <h2 id="formTitle">＋ 新增訂單</h2>
      <span class="hint">標 <span style="color:var(--warn)">*</span> 為必填；尾款金額自動試算</span>
    </div>
    <div class="body">
      <form id="orderForm">
        <input type="hidden" id="orderId">
        <div class="grid">

          <div class="sub-h">客戶資訊</div>
          <div class="field">
            <label>客戶名稱 <span class="req">*</span></label>
            <select id="custName" required>
              <option value="">— 請選擇客戶 —</option>
              <option>Feeling Bar</option>
              <option>南坡萬公版</option>
              <option>Feeling Bar Cafe</option>
              <option>南坡萬v.2</option>
            </select>
          </div>
          <div class="field">
            <label>客戶端聯繫人</label>
            <input id="custContact" placeholder="例：林先生">
          </div>
          <div class="field">
            <label>聯繫電話</label>
            <input id="custPhone" placeholder="例：0912-345-678">
          </div>

          <div class="sub-h">訂單內容</div>
          <div class="field">
            <label>訂單類型 <span class="req">*</span></label>
            <select id="orderType" required>
              <option value="">— 請選擇 —</option>
              <option>一般公版酒</option>
              <option>換前標公版酒</option>
              <option>全客製酒款</option>
            </select>
          </div>
          <div class="field col2">
            <label>Key 單日 <span class="req">*</span></label>
            <input type="date" id="keyDate" required>
          </div>

          <div class="field col3">
            <label>酒款明細（可多筆）<span class="req">*</span></label>
            <div id="itemRows"></div>
            <div style="margin-top:9px">
              <button type="button" class="btn ghost sm" id="addItem">＋ 新增一款酒</button>
            </div>
          </div>

          <div class="sub-h">金額</div>
          <div class="field">
            <label>訂單總金額（NT$）<span class="req">*</span></label>
            <input type="number" id="amtTotal" min="0" step="1" required placeholder="0">
          </div>
          <div class="field">
            <label>運費（NT$）</label>
            <input type="number" id="amtFreight" min="0" step="1" placeholder="0">
          </div>
          <div class="field">
            <label>訂金金額（NT$）</label>
            <input type="number" id="amtDeposit" min="0" step="1" placeholder="0">
          </div>
          <div class="field">
            <label>尾款金額（自動試算 = 總額＋運費－訂金）</label>
            <input id="amtBalance" readonly value="0">
          </div>

          <div class="sub-h">付款與出貨時程</div>
          <div class="field">
            <label>訂金付款日（預計 / 實際）</label>
            <div class="pair">
              <div><input type="date" id="depPlan" title="訂金預計付款日"></div>
              <div><input type="date" id="depActual" title="訂金實際付款日"></div>
            </div>
          </div>
          <div class="field">
            <label>尾款付款日（預計 / 實際）</label>
            <div class="pair">
              <div><input type="date" id="finPlan" title="尾款預計付款日"></div>
              <div><input type="date" id="finActual" title="尾款實際付款日"></div>
            </div>
          </div>
          <div class="field">
            <label>預計出貨日 <span class="req">*</span></label>
            <input type="date" id="shipDate" required>
          </div>

        </div>

        <div class="form-actions">
          <button type="button" class="btn ghost" id="resetBtn">清空</button>
          <button type="submit" class="btn gold" id="submitBtn">儲存訂單</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 訂單列表 -->
  <div class="panel">
    <div class="head">
      <h2>訂單列表</h2>
      <div class="toolbar">
        <input id="search" placeholder="搜尋客戶 / 訂單編號…">
        <select id="filterType">
          <option value="">全部類型</option>
          <option>一般公版酒</option>
          <option>換前標公版酒</option>
          <option>全客製酒款</option>
        </select>
        <label style="font-size:12.5px;color:var(--ink-soft);display:flex;gap:5px;align-items:center;font-weight:600">
          <input type="checkbox" id="onlyWarn" style="width:auto"> 只看出貨預警
        </label>
      </div>
    </div>
    <div class="body" style="padding:0">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>訂單編號</th><th>客戶</th><th>類型</th><th>酒款明細</th>
              <th>Key單日</th><th class="num">總額</th><th class="num">尾款</th>
              <th>訂金</th><th>尾款狀態</th><th>預計出貨</th><th>出貨預警</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty">尚無訂單，請於上方表單新增第一筆。</div>
    </div>
  </div>

  <div class="demo-note">
    ※ Demo 版資料暫存於本機瀏覽器（localStorage），重新整理不會遺失；正式版由 Molly 接後端資料庫。
    <button class="btn ghost sm" id="seedBtn" style="margin-left:8px">載入範例資料</button>
    <button class="btn ghost sm" id="clearBtn">清除全部</button>
  </div>

</div>

<script>
/* =====================================================================
   SCHEMA — 單筆訂單資料結構（給 Molly 後端對應）
   order = {
     id:          String,   // 訂單編號，如 "NPW-20260613-001"
     custName:    String,   // 客戶名稱
     custContact: String,   // 客戶端聯繫人
     custPhone:   String,   // 聯繫電話
     orderType:   String,   // 一般公版酒 / 換前標公版酒 / 全客製酒款
     items:       [ { product:String, volume:"100ml"|"500ml", qty:Number } ],
     keyDate:     "YYYY-MM-DD",  // key 單日
     amtTotal:    Number,   // 訂單總金額
     amtFreight:  Number,   // 運費
     amtDeposit:  Number,   // 訂金金額
     amtBalance:  Number,   // 尾款金額（= total + freight - deposit，前端自動算）
     depPlan:     "YYYY-MM-DD", depActual: "YYYY-MM-DD",  // 訂金 預計/實際 付款日
     finPlan:     "YYYY-MM-DD", finActual: "YYYY-MM-DD",  // 尾款 預計/實際 付款日
     shipDate:    "YYYY-MM-DD",  // 預計出貨日
     createdAt:   ISOString
   }
===================================================================== */

/* ===== v1.2：串接後端 GAS（取代 localStorage Demo）===== */
/* ⚠️ 預覽環境：應指向測試部署 /exec（沙盒），第二部署建好後替換 __TEST_EXEC_URL__ */
const API='__TEST_EXEC_URL__';
async function api(params){
  const url=API+'?'+Object.entries(params).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  try{ const r=await fetch(url); return await r.json(); }
  catch(e){ return {ok:false,error:e.message}; }
}
const VOLUMES=["100ml","500ml"];
const BOTTLES=["江小白","伏特加","波士頓","4L桶","山形瓶","雷神瓶"];
const WARN_DAYS=7;
let clientRecipes=[];   // 目前選定客戶的酒譜 [{recipeName, sheet}]

const $ = s=>document.querySelector(s);
const fmt = n => "NT$"+Number(n||0).toLocaleString("en-US");
const today = ()=>{ const d=new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => s? new Date(s+"T00:00:00") : null;
const daysTo = s => { const d=parseD(s); return d? Math.round((d-today())/86400000) : null; };
function toast(msg){ let t=$("#miniToast"); if(!t){ t=document.createElement("div"); t.id="miniToast"; t.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2F3A33;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;z-index:9999;"; document.body.appendChild(t);} t.textContent=msg; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity="0",2600); }

/* ---------- 客戶 → 載入該客戶酒譜 → 刷新酒款下拉 ---------- */
function prodOptions(selectedSheet){
  return clientRecipes.map(p=>`<option value="${p.sheet}" ${p.sheet===selectedSheet?"selected":""}>${p.recipeName}</option>`).join("");
}
async function loadClientRecipes(){
  const client=$("#custName").value;
  clientRecipes=[];
  if(client){
    const r=await api({action:"getClientRecipeList",client});
    if(r.ok) clientRecipes=(r.list||[]).map(x=>({recipeName:x.recipeName||x.sheet, sheet:x.sheet}));
    else toast("讀取酒譜失敗："+(r.error||""));
  }
  document.querySelectorAll(".item-row .it-prod").forEach(sel=>{
    const cur=sel.value;
    sel.innerHTML='<option value="">— 選擇酒款 —</option>'+prodOptions(cur);
  });
}

/* ---------- 酒款明細列 ---------- */
function itemRowHTML(it={sheet:"",volume:"100ml",bottleType:"",qty:1}){
  const prods=prodOptions(it.sheet);
  const vols=VOLUMES.map(v=>`<option ${v===it.volume?"selected":""}>${v}</option>`).join("");
  const bots=BOTTLES.map(b=>`<option ${b===it.bottleType?"selected":""}>${b}</option>`).join("");
  return `<div class="item-row">
    <select class="it-prod"><option value="">— 選擇酒款 —</option>${prods}</select>
    <select class="it-vol">${vols}</select>
    <select class="it-bottle"><option value="">瓶型</option>${bots}</select>
    <input class="it-qty" type="number" min="1" step="1" value="${it.qty||1}" placeholder="瓶數">
    <button type="button" class="del" title="刪除此款">×</button>
  </div>`;
}
function addItemRow(it){ $("#itemRows").insertAdjacentHTML("beforeend", itemRowHTML(it)); }
function readItems(){
  return [...document.querySelectorAll(".item-row")].map(r=>{
    const sel=r.querySelector(".it-prod"); const sheet=sel.value;
    const product=sheet? sel.options[sel.selectedIndex].text : "";
    return { product, sheet, volume:r.querySelector(".it-vol").value,
      bottleType:r.querySelector(".it-bottle").value,
      qty:Number(r.querySelector(".it-qty").value)||0, status:"待製作" };
  }).filter(i=>i.sheet && i.qty>0);
}
$("#itemRows").addEventListener("click",e=>{
  if(e.target.classList.contains("del")){
    e.target.closest(".item-row").remove();
    if(!document.querySelector(".item-row")) addItemRow();
  }
});
$("#addItem").onclick = ()=>addItemRow();
$("#custName").addEventListener("change", loadClientRecipes);

/* ---------- 尾款自動試算 ---------- */
function recalc(){
  const bal=(Number($("#amtTotal").value)||0)+(Number($("#amtFreight").value)||0)-(Number($("#amtDeposit").value)||0);
  $("#amtBalance").value=bal.toLocaleString("en-US");
}
["amtTotal","amtFreight","amtDeposit"].forEach(id=>$("#"+id).addEventListener("input",recalc));

/* ---------- 表單送出 → createOrder ---------- */
let _submitting=false;
$("#orderForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(_submitting) return;
  const client=$("#custName").value;
  if(!client){ alert("請選擇客戶"); return; }
  const items=readItems();
  if(items.length===0){ alert("請至少新增一款酒（選酒款並填瓶數）"); return; }
  const total=Number($("#amtTotal").value)||0;
  const freight=Number($("#amtFreight").value)||0;
  const deposit=Number($("#amtDeposit").value)||0;
  const balance=total+freight-deposit;
  const depositStatus = deposit>0 ? ("已收訂金 "+fmt(deposit)) : "未收訂金";
  _submitting=true;
  const btn=$("#submitBtn"); const old=btn.textContent; btn.textContent="送出中…"; btn.disabled=true;
  const res=await api({ action:"createOrder", client, orderType:$("#orderType").value,
    deliveryDate:$("#shipDate").value, items:JSON.stringify(items),
    total, balance, depositStatus, pm:"" });
  btn.textContent=old; btn.disabled=false; _submitting=false;
  if(res.ok){ toast("訂單已建立："+res.orderNo); resetForm(); render(); }
  else alert("建立失敗："+(res.error||"未知錯誤"));
});

function resetForm(){
  $("#orderForm").reset(); $("#orderId").value=""; clientRecipes=[];
  $("#itemRows").innerHTML=""; addItemRow(); recalc();
  $("#formTitle").textContent="＋ 新增訂單"; $("#submitBtn").textContent="儲存訂單";
}
$("#resetBtn").onclick=resetForm;

/* ---------- 出貨狀態徽章 ---------- */
function shipBadge(o){
  const d=daysTo(o.deliveryDate);
  if(o.status==="已完成") return {cls:"b-ok",txt:"已完成",row:""};
  if(d===null) return {cls:"b-gray",txt:o.status||"—",row:""};
  if(d<0) return {cls:"b-warn",txt:"逾期"+Math.abs(d)+"天",row:"warn-row"};
  if(d<=WARN_DAYS) return {cls:"b-warn",txt:"剩 "+d+" 天",row:"warn-row"};
  return {cls:"b-gray",txt:o.status||"待製作",row:""};
}

/* ---------- 渲染（讀 getOrders）---------- */
async function render(){
  const res=await api({action:"getOrders"});
  const all=(res.ok?(res.orders||[]):[]).sort((a,b)=>(a.deliveryDate||"9999").localeCompare(b.deliveryDate||"9999"));
  const q=$("#search").value.trim().toLowerCase();
  const ft=$("#filterType").value; const onlyWarn=$("#onlyWarn").checked;
  let warnN=0,makingN=0,doneN=0;
  all.forEach(o=>{ const d=daysTo(o.deliveryDate);
    if(o.status!=="已完成"&&d!==null&&d<=WARN_DAYS)warnN++;
    if(o.status==="已完成")doneN++; else makingN++; });
  if($("#cTotal"))$("#cTotal").textContent=all.length;
  if($("#cWarn"))$("#cWarn").textContent=warnN;
  if($("#cDep"))$("#cDep").textContent=makingN;
  if($("#cFinal"))$("#cFinal").textContent=doneN;
  const upcoming=all.filter(o=>o.status!=="已完成"&&daysTo(o.deliveryDate)!==null&&daysTo(o.deliveryDate)<=WARN_DAYS)
                    .sort((a,b)=>daysTo(a.deliveryDate)-daysTo(b.deliveryDate));
  const ab=$("#alertBanner");
  if(upcoming.length){ ab.style.display="block";
    ab.innerHTML="⚠️ <b>出貨預警</b>：以下 "+upcoming.length+" 筆訂單已進入出貨倒數（≤"+WARN_DAYS+"天）→ "+
      upcoming.slice(0,4).map(o=>{const d=daysTo(o.deliveryDate);return `${o.client}（${d<0?"逾期"+Math.abs(d)+"天":"剩"+d+"天"}）`;}).join("、")+
      (upcoming.length>4?" 等…":"");
  } else ab.style.display="none";
  const rows=all.filter(o=>{
    if(ft && o.orderType!==ft) return false;
    if(q && !((o.client||"").toLowerCase().includes(q)||(o.orderNo||"").toLowerCase().includes(q))) return false;
    if(onlyWarn){ const d=daysTo(o.deliveryDate); if(o.status==="已完成"||d===null||d>WARN_DAYS) return false; }
    return true;
  });
  const tb=$("#orderRows");
  if($("#emptyState"))$("#emptyState").style.display=rows.length?"none":"block";
  tb.innerHTML=rows.map(o=>{
    const ss=shipBadge(o);
    const itemsTxt=(o.items||[]).map(i=>`${i.product} ${i.volume}×${i.qty}${i.status==="完成"?" ✓":""}`).join("、");
    return `<tr class="${ss.row}">
      <td><b>${o.orderNo}</b></td>
      <td>${o.client}</td>
      <td><span class="badge b-gray">${o.orderType||"—"}</span></td>
      <td style="white-space:normal;max-width:230px">${itemsTxt||"—"}</td>
      <td>${o.createdAt? String(o.createdAt).slice(0,10):"—"}</td>
      <td class="num">${fmt(o.total)}</td>
      <td class="num">${fmt(o.balance)}</td>
      <td>${o.depositStatus||"—"}</td>
      <td>—</td>
      <td>${o.deliveryDate||"—"}</td>
      <td><span class="badge ${ss.cls}">${ss.txt}</span></td>
      <td><div class="row-act"><span style="font-size:11px;color:var(--ink-soft)">後端訂單</span></div></td>
    </tr>`;
  }).join("");
}
["search","filterType","onlyWarn"].forEach(id=>$("#"+id).addEventListener("input",render));

/* Demo 用按鈕已停用（改後端） */
if($("#seedBtn")) $("#seedBtn").style.display="none";
if($("#clearBtn")) $("#clearBtn").style.display="none";

/* ---------- 啟動 ---------- */
addItemRow();
recalc();
render();

</script>
</body>
