name: Deploy GAS

on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
      - '.github/workflows/deploy-gas.yml'
  workflow_dispatch: {}

concurrency:
  group: gas-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write clasp credentials
        env:
          CLASPRC: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC" ]; then
            echo "::error::缺少 Secret CLASPRC_JSON"
            exit 1
          fi
          echo "$CLASPRC" > ~/.clasprc.json

      - name: Install clasp(依憑證格式自動選版本）
        run: |
          # v3 格式含 "tokens"，v2 格式含 "token"
          if python3 -c "import json;d=json.load(open('$HOME/.clasprc.json'));exit(0 if 'tokens' in d else 1)"; then
            echo "偵測到 clasp v3 憑證格式 → 安裝最新版"
            npm install -g @google/clasp
          else
            echo "偵測到 clasp v2 憑證格式 → 安裝 2.4.2"
            npm install -g @google/clasp@2.4.2
          fi
          clasp --version

      - name: Prepare build dir
        run: |
          if [ ! -f "gas/appsscript.json" ]; then
            echo "::error::repo 缺少 gas/appsscript.json"
            exit 1
          fi
          mkdir -p build
          # v3.28 起後端多檔（程式碼.gs + consign.gs …）：一律全部複製；只複製一個檔會被 clasp push --force 把其他檔推掉（2026-09-03 事故）
          for f in gas/*.gs; do cp "$f" "build/$(basename "${f%.gs}").js"; done
          ls -la build
          cp gas/appsscript.json build/appsscript.json
          printf '%s\n' '{"scriptId":"1rZVFLOW4lYPQCRGZZYDqdMLAOEP5fzX_fpe--62lC3gFASBGEe7p1gH5","rootDir":"."}' > build/.clasp.json

      - name: clasp push + deploy（固定 deploymentId，鐵則 Bug 11）
        working-directory: build
        run: |
          clasp push --force
          clasp deploy --deploymentId "AKfycbzAfsGzzbg3FV6d8-x2sWFPO1o5N4uT9RBaqAHiqWBPseCrSvKV3QnC9NK9S2MGnHQvJg" --description "auto ${GITHUB_SHA::8}"
