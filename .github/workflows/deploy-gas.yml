name: Deploy GAS

on:
  push:
    paths:
      - 'gas/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install clasp
        run: npm install -g @google/clasp
      - name: Write clasp credentials
        run: echo '${{ secrets.CLASP_RC }}' > ~/.clasprc.json
      - name: Push to GAS
        working-directory: gas
        run: clasp push --force
      - name: Deploy
        working-directory: gas
        run: clasp deploy --deploymentId "${{ secrets.DEPLOYMENT_ID }}"
